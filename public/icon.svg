<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <g transform="translate(156, 110)">
    <!-- Microphone Capsule -->
    <rect x="60" y="20" width="80" height="150" rx="40" fill="#FFFFFF" />
    <!-- Microphone Cradle -->
    <path d="M 30,110 A 70,70 0 0,0 170,110" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <!-- Microphone Stem & Stand -->
    <line x1="100" y1="180" x2="100" y2="230" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <line x1="60" y1="230" x2="140" y2="230" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
    <!-- Acoustic Soundwaves -->
    <path d="M 0,80 A 110,110 0 0,0 0,140" fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" />
    <path d="M 200,80 A 110,110 0 0,1 200,140" fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
